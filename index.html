<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1f8a5b">
<title>Brain Tickle · মগজ সুড়সুড়ি</title>
<meta name="description" content="Funny picture puzzles for friends and family · বন্ধু ও পরিবারের জন্য মজার ছবির ধাঁধা">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6e6; --card:#ffffff; --ink:#2a2017; --muted:#7a6a58; --line:#ecdcc4;
  --green:#1f8a5b; --green-d:#166a45; --red:#e2463a; --yellow:#ffc93c; --blue:#2f6fd6;
  --ok:#dff5e8; --bad:#fde3e0; --shadow:0 6px 18px rgba(80,50,10,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo Da 2","Noto Sans Bengali",system-ui,sans-serif;font-size:19px;line-height:1.35;min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;width:100%;max-width:540px;margin:0 auto;padding:14px 16px 24px}
footer{text-align:center;color:var(--muted);font-size:15px;padding:14px 16px 18px;border-top:1px dashed var(--line)}
footer b{color:var(--ink)}
h1,h2,h3{margin:.2em 0;line-height:1.2}
.bn{display:block;font-size:.88em;color:var(--muted)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.center{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font:inherit;font-weight:800;font-size:21px;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--green-d);margin:10px 0;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn .bn{color:#e6f7ee;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.alt .bn{color:var(--muted)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 #d9a21a}
.btn.yellow .bn{color:#5b4300}
.btn:disabled{opacity:.6}
.row{display:flex;gap:10px}
.row>*{flex:1}
input.big{width:100%;font:inherit;font-size:28px;font-weight:800;letter-spacing:2px;text-align:center;padding:12px;border-radius:16px;border:3px solid var(--line);background:#fffdf8;color:var(--ink)}
input.big:focus{outline:none;border-color:var(--green)}
.err{color:var(--red);font-weight:600;min-height:1.4em;text-align:center;font-size:17px}
.mascot{width:110px;height:110px;display:block;margin:0 auto}
.mascot.sm{width:72px;height:72px;margin:0;flex:none}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:600}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;font-size:17px}
.level{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;margin:10px 0;border:0;width:100%;font:inherit;text-align:left;cursor:pointer;color:inherit}
.level .ic{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--bg);border-radius:14px;flex:none}
.level .t{flex:1;min-width:0}
.level .t b{display:block;font-size:19px}
.level .t small{display:block;color:var(--muted);font-size:15px}
.level .st{font-size:18px;white-space:nowrap}
.level.locked{opacity:.55;cursor:default}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.topbar .pill{background:#fff;border-radius:999px;padding:4px 12px;box-shadow:var(--shadow);font-size:17px;white-space:nowrap}
.linkbtn{background:none;border:0;font:inherit;color:var(--green-d);font-weight:800;padding:6px 0;cursor:pointer;font-size:17px}
.q{display:flex;gap:10px;align-items:center;margin:10px 0}
.q .txt{font-weight:800;font-size:21px}
.visual{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;margin:10px 0;text-align:center}
.seq{font-size:38px;letter-spacing:4px;word-break:break-word;line-height:1.4}
.gridv{display:grid;gap:6px;justify-content:center;font-size:32px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{border:3px solid var(--line);background:#fff;border-radius:18px;font:inherit;font-weight:800;font-size:34px;min-height:78px;cursor:pointer;color:var(--ink);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.opt.text{font-size:19px;min-height:70px}
.opt.text small{font-size:16px;color:var(--muted);font-weight:600}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--ok);border-color:var(--green)}
.opt.bad{background:var(--bad);border-color:var(--red)}
.opt[disabled]{cursor:default}
.opt .sh{filter:brightness(0);opacity:.82;display:inline-block}
.opt .xf,.big-e{display:inline-block;font-family:"Baloo Da 2",system-ui,sans-serif}
.big-e{font-size:84px;line-height:1.1}
.cells{display:grid;gap:6px;margin:12px 0}
.cells .opt{min-height:0;aspect-ratio:1;font-size:30px;border-width:2px;border-radius:12px;padding:0}
.eq{font-size:30px;margin:6px 0;white-space:nowrap}
.eq b{font-size:26px}
.feedback{margin:12px 0;display:flex;gap:10px;align-items:flex-start}
.feedback .bubble{flex:1}
.pts{font-weight:800;color:var(--green-d)}
.pts.zero{color:var(--red)}
.why{display:block;font-weight:600;color:var(--muted);font-size:16px;margin-top:4px}
.big-num{font-size:44px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--muted);font-size:15px}
.stars{font-size:40px;letter-spacing:4px}
table.lb{width:100%;border-collapse:collapse}
.lb td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.lb tr.you td{background:#fff3cf}
.lb .rk{width:44px;text-align:center;font-weight:800;font-size:22px}
.lb .nm b{display:block;font-size:19px;word-break:break-word}
.lb .nm small{color:var(--muted);font-size:14px}
.lb .sc{text-align:right;font-weight:800;white-space:nowrap}
.lb .sc small{display:block;color:var(--muted);font-weight:600;font-size:14px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.badge .e{font-size:42px}
.badge b{display:block;font-size:17px}
.badge small{display:block;color:var(--muted);font-size:14px}
.badge.off{opacity:.45;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
.demo{background:#fff3cf;border:2px dashed #e0b23a;border-radius:14px;padding:8px 12px;font-size:15px;text-align:center;margin-bottom:6px}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
svg text{font-family:"Baloo Da 2",system-ui,sans-serif}
.level.pro{background:linear-gradient(135deg,#fff 60%,#fff3cf);border:2px solid #f0c64a}
.newtag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:middle;line-height:1.5}
.zone{display:flex;align-items:center;gap:10px;margin:18px 0 4px;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,#2a2017,#5a3a1a);color:#ffd54a}
.zone b{font-size:20px}.zone small{display:block;color:#f4e3c0;font-size:14px}
.opt.eq{font-size:30px;letter-spacing:1px}
.opt.gone{opacity:.18;filter:grayscale(1)}
.hintbtn{display:block;margin:4px auto 0;background:#fff3cf;border:2px dashed #e0b23a;border-radius:14px;font:inherit;font-weight:800;padding:8px 16px;cursor:pointer;color:var(--ink)}
.hintbtn:disabled{opacity:.5}
.flashbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.flashbar i{display:block;height:100%;background:var(--red);transform-origin:left}
.receipt{background:#fffdf3;border:2px dashed #d9c49a;border-radius:14px;padding:10px 14px;text-align:left;font-size:18px}
.receipt .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted #e6d5b0}
.receipt .ln small{color:var(--muted)}
.note{display:inline-block;margin-top:10px;background:linear-gradient(135deg,#7bc47f,#2e8b57);color:#fff;font-weight:800;border-radius:8px;padding:6px 14px;font-size:20px;box-shadow:0 2px 0 #1d6b40}
.numgrid{margin:0 auto;border-collapse:separate;border-spacing:6px}
.numgrid td{width:70px;height:58px;background:var(--bg);border-radius:12px;font-size:28px;font-weight:800;text-align:center}
.numgrid td.q{background:#fff3cf;border:2px dashed #e0b23a}
.overlay{position:fixed;inset:0;background:rgba(42,32,23,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay .card{max-width:420px;width:100%;margin:0}
.overlay ul{text-align:left;padding-left:20px;margin:8px 0}
.overlay li{margin:6px 0}
.season{display:inline-block;background:var(--ink);color:#ffd54a;font-weight:800;border-radius:999px;padding:3px 14px;font-size:15px;margin-bottom:2px}
.cont{background:var(--green);color:#fff;border-radius:10px;padding:2px 8px;font-size:15px;font-weight:800}
.rules{background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;font-size:16px;margin:10px 0}
.rules div{margin-top:3px}
.practag{background:#e8f0ff;border:2px dashed var(--blue);border-radius:12px;padding:4px 10px;font-size:14px;text-align:center;margin-top:8px}
.s1{font-size:13px;background:#fff3cf;border-radius:8px;padding:0 5px;white-space:nowrap}
.hofcard{background:linear-gradient(160deg,#2a2017,#5a3a1a);color:#ffd54a}
.hofcard .bn{color:#f4e3c0}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin-top:12px}
.pod{background:rgba(255,255,255,.12);border-radius:12px 12px 0 0;padding:8px 6px;width:30%;color:#fff}
.pod b{display:block;font-size:15px;word-break:break-word}.pod small{color:#ffd54a;font-weight:800}
.pod.p1{min-height:120px}.pod.p2{min-height:96px}.pod.p3{min-height:80px}
.opt.bad{text-decoration:line-through}
.rulecard{padding:12px 16px}
.rulecard h3{margin:0 0 6px;font-size:20px}
.rulecard p{margin:6px 0;font-size:18px;line-height:1.5}
.rulecard ul{margin:6px 0;padding-left:20px;font-size:18px;line-height:1.5}
.rulecard li{margin:4px 0}
.rulesbanner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  background:#fff3cf;border:3px solid #e0b23a;border-radius:20px;padding:12px 14px;margin:12px 0 4px;box-shadow:0 4px 0 #d9a21a;animation:pulse 1.6s ease-in-out infinite}
.rulesbanner b{display:block;font-size:21px}.rulesbanner small{display:block;font-size:16px;color:#5b4300;margin-top:2px}
.rulesbanner .go{display:inline-block;margin-top:6px;background:var(--green);color:#fff;font-weight:800;border-radius:12px;padding:4px 14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.level.needrules{opacity:.6}
.agreebox{background:#fff;border:3px dashed var(--green);border-radius:18px;padding:14px;margin:12px 0;font-size:19px;line-height:1.5}
.agreebox label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:600}
.agreebox input{width:30px;height:30px;flex:none;margin-top:2px;accent-color:var(--green)}
.agreebox.done{border-style:solid;background:var(--ok);font-weight:800;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;font:inherit;font-weight:800;font-size:18px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:#fffdf8;color:var(--muted);cursor:pointer;line-height:1.2}
.tab .bn{font-size:15px}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}.tab.on .bn{color:#e6f7ee}
input.big.email{font-size:20px;letter-spacing:0;text-transform:none}
.privacy{font-size:15px;color:var(--muted);text-align:center;margin:6px 0 0}
</style>

<body>
<main id="app"></main>
<footer>Developed by <b>Md Abid Hassan Mitul</b> || <span id="ver"></span></footer>

<script src="questions.js"></script>
<script>
/* =========================================================
   SETTINGS
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxxZIFccTCCvfB6uInVRrs5DBaq_5dbBmY035o78QbJlUX2BheH1FojzG5J4pQLk-FeSA/exec";

/* Version shown in the footer. Change it every time you upload a new index.html,
   e.g. 2.0.0 → 2.0.1 for a small fix, 2.1.0 for a new feature (like new levels). */
const APP_VERSION = "2.0.0";

/* Shown once to every returning player after an update. Edit this for each new version. */
const WHATS_NEW = {
  en: ["🎉 Season 2 has started! Everyone starts from 0", "🧩 10 brand-new levels, 150 puzzles, from easy to hard",
       "🔁 New rule: keep trying until you get it right. The 1st tap earns the most!", "💾 Progress saves after every answer. Continue anytime",
       "🏛️ Season 1 Hall of Fame: congratulations to our champions!"],
  bn: ["সিজন ২ শুরু! সবাই শূন্য থেকে শুরু", "১০টা নতুন লেভেল, ১৫০টা ধাঁধা, সহজ থেকে কঠিন",
       "নতুন নিয়ম: সঠিক না হওয়া পর্যন্ত চেষ্টা করুন। প্রথম চাপে সবচেয়ে বেশি পয়েন্ট!", "প্রতিটা উত্তরের পর অগ্রগতি সেভ হয়। যেকোনো সময় আবার শুরু করুন",
       "সিজন ১ হল অফ ফেম: আমাদের চ্যাম্পিয়নদের অভিনন্দন!"]
};

const PER_LEVEL = 10, HINT_COST = 100;
/* Change RULES_VER when the rules change: everyone will be asked to agree again. */
const RULES_VER = '2.0';
const DEMO = false;
const $app = document.getElementById('app');
document.getElementById('ver').textContent = 'V ' + APP_VERSION;

/* ---------- scoring (the Sheet uses exactly the same numbers) ---------- */
/* Speed bonus window per level: [full bonus up to (s), no bonus from (s)]. Must match BONUS in Code.gs. */
const BONUS = {1:[20,90], 2:[20,90], 3:[8,45], 4:[20,90], 5:[25,120], 6:[25,120], 7:[25,120], 8:[30,120], 9:[30,120], 10:[30,120]};
const bonusWin = lv => BONUS[lv] || [20, 90];
function pointsFor(wrong, secs, lv){
  const [f, e] = bonusWin(lv);
  if (wrong === 0) return 100 + (secs <= f ? 50 : secs >= e ? 0 : Math.round(50 * (e - secs) / (e - f)));
  return wrong === 1 ? 40 : wrong === 2 ? 10 : 0;
}
function starsFor(mistakes){ return mistakes === 0 ? 3 : mistakes <= 3 ? 2 : 1; }

/* ---------- small helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = (en, bn) => `${en}<span class="bn">${bn}</span>`;
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function fmtTime(sec){ sec = Math.round(sec); const m = Math.floor(sec/60), s = sec%60; return m ? `${m}m ${s}s` : `${s}s`; }
function starStr(n){ return '⭐'.repeat(n) + '☆'.repeat(3-n); }
function toast(msg){ const t = document.createElement('div'); t.className='toast pop'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function normPhone(v){
  let s = String(v||'').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/\D/g,'');
  if (s.length === 13 && s.startsWith('880')) s = s.slice(2);
  return s;
}

/* ---------- Mama, the mascot (original cartoon, drawn in SVG) ---------- */
function mascot(expr, cls){
  const skin = '#f0b98a', dark = '#2a2017';
  let brows, eyes, mouth, extra = '', gold = false;
  try { gold = !!(S.player && S.player.stars >= 30); } catch(e){}
  switch(expr){
    case 'happy':
      brows = `<path d="M38 44 q8-6 16 0 M66 44 q8-6 16 0" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      eyes = `<path d="M40 56 q6-7 12 0 M68 56 q6-7 12 0" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      mouth = `<path d="M46 84 q14 16 28 0 z" fill="#8a2b1f"/>`; break;
    case 'laugh':
      brows = `<path d="M38 42 l14 4 M82 42 l-14 4" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>`;
      eyes = `<path d="M40 52 l10 5 l-10 5 M80 52 l-10 5 l10 5" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      mouth = `<path d="M42 80 q18 26 36 0 z" fill="#8a2b1f"/><path d="M50 90 q10 8 20 0" fill="#e86a6a"/>`;
      extra = `<path d="M30 60 q-4 8 0 12 q4-4 0-12z M90 60 q4 8 0 12 q-4-4 0-12z" fill="#6cc3f0"/>`; break;
    case 'shock':
      brows = `<path d="M38 36 q8-8 16-2 M66 34 q8-6 16 2" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      eyes = `<circle cx="46" cy="55" r="8" fill="#fff" stroke="${dark}" stroke-width="3"/><circle cx="74" cy="55" r="8" fill="#fff" stroke="${dark}" stroke-width="3"/><circle cx="46" cy="55" r="3.5" fill="${dark}"/><circle cx="74" cy="55" r="3.5" fill="${dark}"/>`;
      mouth = `<ellipse cx="60" cy="88" rx="7" ry="9" fill="#8a2b1f"/>`; break;
    case 'party':
      brows = '';
      eyes = `<rect x="34" y="48" width="22" height="12" rx="5" fill="${dark}"/><rect x="64" y="48" width="22" height="12" rx="5" fill="${dark}"/><path d="M56 53 h8" stroke="${dark}" stroke-width="4"/>`;
      mouth = `<path d="M44 82 q16 18 32 0 z" fill="#8a2b1f"/>`;
      extra = `<g fill="#ffc93c"><circle cx="14" cy="22" r="4"/><circle cx="104" cy="18" r="4"/></g><g fill="#e2463a"><rect x="98" y="34" width="6" height="6" transform="rotate(30 101 37)"/><rect x="12" y="40" width="6" height="6"/></g><g fill="#1f8a5b"><circle cx="24" cy="8" r="3"/><circle cx="94" cy="6" r="3"/></g>`; break;
    default: /* think */
      brows = `<path d="M38 44 q8-4 16 0 M66 38 q8-6 16 0" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      eyes = `<circle cx="46" cy="55" r="4.5" fill="${dark}"/><circle cx="76" cy="52" r="4.5" fill="${dark}"/>`;
      mouth = `<path d="M52 88 q8 -3 16 1" stroke="#8a2b1f" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      extra = `<text x="96" y="30" font-size="26" font-weight="800" fill="#1f8a5b">?</text>`;
  }

/* ---------- backend: your Google Sheet ---------- */
async function api(action, data){
  const body = Object.assign({action}, data||{});
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 25000);
  try {
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), signal:ctl.signal});
    return await res.json();
  } catch(e){ return {ok:false, error:'network'}; }
  finally { clearTimeout(timer); }
}

const isEmail = v => /^[^\s@'"<>]+@[^\s@'"<>]+\.[a-z]{2,}$/i.test(v) && v.length <= 80;
function showLogin(err, mode){
  mode = mode || (S.phone && S.phone.includes('@') ? 'email' : store.get('bt_mode') || 'phone');

  render(`

      </div>
      <label for="ph" style="font-weight:800">${email ? L('Your email address','আপনার ইমেইল') : L('Your mobile number','আপনার মোবাইল নম্বর')}</label>
      ${email ? `<input id="ph" class="big email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="name@gmail.com" value="${esc(S.phone && S.phone.includes('@') ? S.phone : '')}">`
              : `<input id="ph" class="big" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="01XXXXXXXXX" value="${esc(S.phone && !S.phone.includes('@') ? S.phone : '')}">`}
      <div class="err" id="err">${err||''}</div>
      <button class="btn" id="go">${L('Next ▶','পরবর্তী ▶')}</button>
      <p class="privacy">🔒 ${L('Private: never shown to other players. No OTP, no spam.','গোপন থাকবে: অন্য কেউ দেখবে না। কোনো ওটিপি বা স্প্যাম নেই।')}</p>
    </div>`);
  const ph = document.getElementById('ph');
  document.getElementById('t-phone').onclick = () => { store.set('bt_mode', 'phone'); showLogin('', 'phone'); };
  document.getElementById('t-email').onclick = () => { store.set('bt_mode', 'email'); showLogin('', 'email'); };
  const go = async () => {
    const n = email ? ph.value.trim().toLowerCase().replace(/\s+/g, '') : normPhone(ph.value);
    if (email ? !isEmail(n) : !/^01[3-9]\d{8}$/.test(n)){
      document.getElementById('err').innerHTML = email ? L('Please enter a valid email (name@gmail.com)','সঠিক ইমেইল দিন (name@gmail.com)')
                                                       : L('Please enter a valid 11-digit number (01XXXXXXXXX)','সঠিক ১১ সংখ্যার নম্বর দিন (01XXXXXXXXX)');
      ph.classList.add('shake'); setTimeout(() => ph.classList.remove('shake'), 400); return;
    }
    loading();
    const r = await api('check', {phone:n});
    if (!r.ok) return r.error === 'network' ? netError(go) : showLogin(L('Something went wrong. Try again.','কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।'));
    S.phone = n; store.set('bt_phone', n);
    r.status === 'pin' ? showPin() : showRegister(r.status === 'setpin', r.name || '');
  };
  document.getElementById('go').onclick = go;
  ph.onkeydown = e => { if (e.key === 'Enter') go(); };
}

const QKEY = 'bt_queue';

const qSave = q => store.set(QKEY, JSON.stringify(q));
let flushing = null;
function flush(){
  if (flushing) return flushing;
  const run = async () => {
      for (let q = qLoad(); q.length; q = qLoad()){
        const it = q[0];
        if (it.phone === S.phone && S.token){
          const r = await api('answer', authed({level:it.level, q:it.q, wrong:it.wrong, secs:it.secs}));
          if (!r.ok && (r.error === 'network' || r.error === 'auth')) return false;
          if (r.player) S.player = r.player;
        }
        const now = qLoad(); now.shift(); qSave(now);   // sent (or not ours / out of date): remove it
      }
      return true;
  };
  flushing = run().finally(() => { flushing = null; });
  return flushing;
}

/* ---------- playing ---------- */
let G = null, ticker = null;
/* Same puzzles, fresh look every time: answer positions, picture layout, maze vehicles. */
function shuffled(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function remix(q){
  const c = JSON.parse(JSON.stringify(q)), v = c.v || {};
  let right = c.o[c.a];
  if (c.t === 'diff2'){
    const odd = c.o[c.a[0]], base = c.o.find((x, i) => !c.a.includes(i));
    c.a = shuffled([...c.o.keys()]).slice(0, 2).sort((x, y) => x - y);
    c.o = c.o.map((x, i) => c.a.includes(i) ? odd : base);
    return c;
  }
  if (c.t === 'count' || c.t === 'flash') v.grid = shuffled(v.grid);
  if (c.t === 'maze'){
    const winLine = v.starts.indexOf(right);
    v.starts = shuffled(v.starts);
    right = v.starts[winLine];
    c.o = [right].concat(shuffled(v.starts.filter(x => x !== right)).slice(0, Math.min(3, v.starts.length - 1)));
  }
  const key = x => JSON.stringify(x);
  c.o = shuffled(c.o);
  c.a = c.o.findIndex(x => key(x) === key(right));
  return c;
}
function newGameId(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }

async function startLevel(lv){
  if (!agreed()) return showRules(() => showIntro(lv));
  loading();
  if (await flush() === false) return netError(() => startLevel(lv));
  const pool = poolOf(lv);
  const r = await api('start', authed({level:lv, pool:pool.length}));
  if (!r.ok){
    if (r.error === 'network') return netError(() => startLevel(lv));
    if (r.error === 'auth') return logout();
    toast(r.error === 'locked' ? L('Finish the previous level first','আগে আগের লেভেল শেষ করুন') : L('Something went wrong','কিছু একটা সমস্যা হয়েছে'));
    return showHome();
  }
  S.player = r.player;
  const pr = r.progress;
  if (pr.done) return showIntro(lv);
  G = {lv, mode:'first', qs: pr.ids.map(k => pool[k] || pool[pool.length - 1]).map(remix), i: pr.i, score: pr.s, mistakes: pr.m, time: pr.t, hints: pr.h || 0, before: earned(S.player)};
  showQuestion();
}
function startPractice(lv){
  if (!agreed()) return showRules(() => showIntro(lv));
  const pool = poolOf(lv);
  const ids = shuffled([...pool.keys()]).slice(0, PER_LEVEL).sort((a, b) => a - b);
  G = {lv, mode:'practice', qs: ids.map(k => pool[k]).map(remix), i:0, score:0, mistakes:0, time:0, hints:0, gid:newGameId(), before: earned(S.player)};
  showQuestion();
}

/* Question clock = real time since the question first appeared, breaks included.
   The open question (its time, wrong taps, hints, layout) is remembered, so pausing and coming back changes nothing. */
const CKEY = 'bt_cur';
const curLoad = () => { try { return JSON.parse(store.get(CKEY) || 'null'); } catch(e){ return null; } };
function curSave(){
  if (G.mode !== 'first' || !(G.at || G.seenAt)) return;
  store.set(CKEY, JSON.stringify({phone:S.phone, lv:G.lv, q:G.i, at:G.at, seenAt:G.seenAt, wrong:G.wrong, bad:G.bad, found:G.found, gone:G.gone, qd:G.qs[G.i]}));
}
const clockSecs = () => G && G.at ? Math.max(0, Date.now() - G.at) / 1000 : 0;

function showQuestion(){
  const practice = G.mode === 'practice';
  const c = practice ? null : curLoad();
  const back = c && c.phone === S.phone && c.lv === G.lv && c.q === G.i ? c : null;   // coming back to an open question
  if (back) G.qs[G.i] = back.qd;
  const q = G.qs[G.i];
  Object.assign(G, {wrong: back ? back.wrong : 0, bad: back ? back.bad : [], found: back ? back.found : [], gone: back ? back.gone : [],
                    at: back ? (back.at || (back.seenAt ? Math.min(back.seenAt + q.v.secs * 1000, Date.now()) : null)) : null, seenAt: null,
                    done:false, waitFlash: q.t === 'flash' && !back});   // the memory picture is shown only once
  clearInterval(ticker); clearTimeout(G.flashT);
  render(`
    <div class="topbar">
      <button class="linkbtn" id="quit">${practice ? '✖ ' + L('Quit','বাদ দিন') : '⏸ ' + L('Pause','বিরতি')}</button>
      <span class="pill">${G.i+1} / ${G.qs.length}</span>
      <span class="pill" id="clock">⏱ 0s</span>
      <span class="pill">🏆 ${G.score}</span>
    </div>
    ${practice ? `<div class="practag">🔁 ${L('Practice: coins only, leaderboard not affected','অনুশীলন: শুধু কয়েন, লিডারবোর্ডে প্রভাব নেই')}</div>` : ''}
    <div class="q">${mascot('think','sm')}<div class="txt" id="qtxt">${G.waitFlash ? L(`Remember everything! ${q.v.secs} seconds 👀`, `সব মনে রাখুন! ${q.v.secs} সেকেন্ড 👀`) : L(esc(q.q[0]), esc(q.q[1]))}</div></div>
    <div id="vis">${q.t === 'flash' && !G.waitFlash ? hiddenPic() : visual(q)}</div>
    <div id="optwrap" ${G.waitFlash ? 'style="display:none"' : ''}>${options(q)}
      ${q.t !== 'diff2' ? `<button class="hintbtn" id="hint">💡 ${L(`Mama's Hint · ${HINT_COST} 💰`, `মামার হিন্ট · ${HINT_COST} কয়েন`)}</button>` : ''}</div>
    <div id="fb"></div>`);
  document.getElementById('quit').onclick = () => {
    if (practice){ if (!confirm('Quit practice?\nঅনুশীলন বাদ দেবেন?')) return; }
    else toast(L('Saved! Continue anytime 💾','সেভ হয়েছে! যেকোনো সময় চালিয়ে যান 💾'));
    clearInterval(ticker); clearTimeout(G.flashT); G.done = true; showHome();
  };
  const go = () => {
    if (!G.at){ G.at = Date.now(); curSave(); }
    const tick = () => { const el = document.getElementById('clock'); if (el) el.textContent = '⏱ ' + fmtTime(clockSecs()); };
    tick(); ticker = setInterval(tick, 250);
  };
  if (G.waitFlash){
    const qi = G.i;
    G.seenAt = Date.now(); curSave();
    G.flashT = setTimeout(() => {
      if (!G || G.i !== qi || G.done) return;
      G.waitFlash = false;
      document.getElementById('vis').innerHTML = hiddenPic();
      document.getElementById('qtxt').innerHTML = L(esc(q.q[0]), esc(q.q[1]));
      document.getElementById('optwrap').style.display = '';
      go();
    }, q.v.secs * 1000);
  } else go();
  const btns = [...$app.querySelectorAll('.opt')];
  G.bad.forEach(i => btns[i] && (btns[i].classList.add('bad'), btns[i].disabled = true));
  G.found.forEach(i => btns[i] && (btns[i].classList.add('ok'), btns[i].disabled = true));
  G.gone.forEach(i => btns[i] && (btns[i].classList.add('gone'), btns[i].disabled = true));
  btns.forEach(b => b.onclick = () => tap(+b.dataset.i));
  const hb = document.getElementById('hint');
  if (hb){ if (G.wrong > 0 || G.gone.length) hb.remove(); else hb.onclick = () => useHint(hb); }
}
const hiddenPic = () => `<div class="visual"><div class="big-e">🙈</div><b>${L('Hidden! Now answer…','লুকিয়ে গেছে! এবার উত্তর দিন…')}</b></div>`;

function tap(i){
  if (!G || G.done || G.waitFlash) return;
  const q = G.qs[G.i], btns = [...$app.querySelectorAll('.opt')], b = btns[i];
  if (!b || b.disabled) return;
  if (q.t === 'diff2'){
    if (q.a.includes(i)){ G.found.push(i); b.classList.add('ok'); b.disabled = true; curSave(); if (G.found.length === 2) finishQ(true); return; }
    wrongTap(b); if (G.wrong >= 3) finishQ(false); return;
  }
  if (i === q.a) return finishQ(true);
  wrongTap(b);
  if (G.wrong >= 3 || btns.filter(x => !x.disabled).length <= 1) finishQ(false);
}

function wrongTap(b){
  G.wrong++; G.bad.push(+b.dataset.i); curSave();
  b.classList.add('bad'); b.disabled = true;
  const hb = document.getElementById('hint'); if (hb) hb.remove();   // hints only before the first mistake
  if (G.wrong >= 3) return;
  const joke = pick(JOKES.wrong), next = pointsFor(G.wrong, 0, G.lv);
  document.getElementById('fb').innerHTML = `<div class="feedback pop">${mascot('laugh','sm')}
    <div class="bubble">${L(esc(joke[0]), esc(joke[1]))}<span class="pts zero" style="display:block;margin-top:4px">${L(`Try again! Next correct tap: +${next}`, `আবার চেষ্টা করুন! এবার সঠিক হলে +${next}`)}</span></div></div>`;
}

async function useHint(hb){
  const q = G.qs[G.i];
  if (G.done || G.wrong > 0 || G.gone.length) return;
  if (S.player.coins < HINT_COST) return toast(L(`Not enough coins! You have ${S.player.coins} 💰`, `যথেষ্ট কয়েন নেই! আছে ${S.player.coins}`));
  hb.disabled = true;
  if (G.mode === 'first' && await flush() === false){ hb.disabled = false; return toast(L('No internet. Try again.','ইন্টারনেট নেই। আবার চেষ্টা করুন।')); }
  const r = await api('hint', authed({level: G.lv}));
  if (!r.ok){
    hb.disabled = false;
    if (r.error === 'auth') return logout();
    return toast(r.error === 'no_coins' ? L('Not enough coins!','যথেষ্ট কয়েন নেই!') : L('No internet. Try again.','ইন্টারনেট নেই। আবার চেষ্টা করুন।'));
  }
  if (G.done || G.wrong > 0) return;
  S.player = r.player; G.hints++;
  const btns = [...$app.querySelectorAll('.opt')];
  G.gone = shuffled(btns.map((b, i) => i).filter(i => i !== q.a && !btns[i].disabled)).slice(0, 2);
  G.gone.forEach(i => { btns[i].disabled = true; btns[i].classList.add('gone'); });
  curSave();
  hb.outerHTML = `<p class="center" style="margin:4px 0;font-size:15px">💡 ${L(`Mama removed 2 wrong answers · ${S.player.coins} 💰 left`, `মামা ২টা ভুল উত্তর সরিয়ে দিলো · বাকি ${S.player.coins} কয়েন`)}</p>`;
}

function finishQ(ok){
  if (G.done) return; G.done = true;
  const q = G.qs[G.i];
  clearInterval(ticker);
  const secs = Math.round(clockSecs() * 10) / 10;
  const wrong = ok ? G.wrong : 3, pts = pointsFor(wrong, secs, G.lv);
  G.score += pts; G.mistakes += wrong; G.time += secs;
  const btns = $app.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  [].concat(q.a).forEach(k => btns[k] && btns[k].classList.add('ok'));
  const hb = document.getElementById('hint'); if (hb) hb.remove();
  if (G.mode === 'first'){
    const qq = qLoad(); qq.push({phone:S.phone, level:G.lv, q:G.i, wrong, secs}); qSave(qq);
    store.del(CKEY);
    flush();
  }
  const joke = !ok ? JOKES.reveal : wrong === 2 ? pick(JOKES.retry3) : wrong === 1 ? pick(JOKES.retry) : secs <= 8 ? pick(JOKES.fast) : pick(JOKES.right);
  const face = !ok ? 'laugh' : wrong > 0 ? 'happy' : secs <= 8 ? 'shock' : 'happy';
  const tapTxt = ok ? [['1st tap','প্রথম চাপে'],['2nd tap','দ্বিতীয় চাপে'],['3rd tap','তৃতীয় চাপে']][wrong] : null;
  const last = G.i === G.qs.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="feedback pop">${mascot(face,'sm')}
      <div class="bubble">${L(esc(joke[0]), esc(joke[1]))}
        <span class="pts ${pts ? '' : 'zero'}" style="display:block;margin-top:4px">${pts ? `+${pts} points · পয়েন্ট` : '0 points · ০ পয়েন্ট'}${tapTxt ? ` · ${tapTxt[0]} · ${tapTxt[1]}` : ''} · ⏱ ${fmtTime(secs)}</span>
        ${q.x ? `<span class="why">💡 ${esc(q.x[0])}<br>${esc(q.x[1])}</span>` : ''}
      </div></div>
    <button class="btn" id="next">${last ? L('See result 🏁','ফলাফল দেখুন 🏁') : L('Next ▶','পরবর্তী ▶')}</button>`;
  const n = document.getElementById('next');
  n.onclick = () => { if (n.disabled) return; n.disabled = true; G.i++; last ? finishLevel() : showQuestion(); };
  n.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------- puzzle pictures ---------- */
const taka = n => (n < 0 ? '−৳' : '৳') + Math.abs(n).toLocaleString('en-US');
function visual(q){
  const v = q.v || {};
  switch(q.t){
    case 'next': return `<div class="visual"><div class="seq">${esc(v.seq)}</div></div>`;
    case 'count': {
      const cols = Math.ceil(Math.sqrt(v.grid.length * 1.3));
      return `<div class="visual"><div class="gridv" style="grid-template-columns:repeat(${cols},auto);font-size:${v.grid.length > 18 ? 28 : 34}px">${v.grid.map(e => `<span>${e}</span>`).join('')}</div></div>`;
    }
    case 'shadow': return `<div class="visual"><span class="big-e">${esc(v.e)}</span></div>`;
    case 'mirror': return `<div class="visual"><span class="big-e" style="font-weight:800">${esc(v.e)}</span><span class="bn">${L('Original','আসল ছবি')}</span></div>`;
    case 'maze': return `<div class="visual">${mazeSvg(v)}</div>`;
    case 'clock': return `<div class="visual">${clockSvg(v.h, v.m)}</div>`;
    case 'match': return `<div class="visual">${matchSvg(v.eq)}</div>`;
    case 'flash': {
      const cols = Math.ceil(Math.sqrt(v.grid.length * 1.2));
      return `<div class="visual"><div class="gridv" style="grid-template-columns:repeat(${cols},auto);font-size:36px">${v.grid.map(e => `<span>${e}</span>`).join('')}</div>
        <div class="flashbar"><i style="animation:shrink ${v.secs}s linear forwards"></i></div></div>`;
    }
    case 'gear': return `<div class="visual">${gearSvg(v)}<div style="font-size:15px;color:var(--muted)">🟢 ${L('turns clockwise ↻','ঘড়ির কাঁটার দিকে ঘোরে ↻')}</div></div>`;
    case 'family': return `<div class="visual" style="font-size:48px;padding:8px">👨‍👩‍👧‍👦</div>`;
    case 'money': return `<div class="visual"><div class="receipt">${v.lines.map(l => `<div class="ln"><span>${l[0]} ${esc(l[1][0])}<br><small>${esc(l[1][1])}</small></span><b>${typeof l[2] === 'number' ? taka(l[2]) : esc(l[2])}</b></div>`).join('')}</div>${v.pay ? `<div class="note">💵 ${taka(v.pay)}</div>` : ''}</div>`;
    case 'dice': return `<div class="visual">${netSvg(v)}</div>`;
    case 'grid': return `<div class="visual"><table class="numgrid">${v.rows.map(r => `<tr>${r.map(x => `<td class="${x === '❓' ? 'q' : ''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    case 'scale': return `<div class="visual">${v.eqs.map(e => `<div class="eq">⚖️ ${e.l.join(' <b>+</b> ')} <b>=</b> ${e.r}</div>`).join('')}<div class="eq" style="margin-top:8px">${esc(v.ask)} <b>=</b> ❓</div></div>`;
    default: return '';
  }
}
function options(q){
  if (q.os === 'grid'){
    const cols = (q.v && q.v.cols) || 4;
    return `<div class="cells" style="grid-template-columns:repeat(${cols},1fr)">${q.o.map((e,i) => `<button class="opt" data-i="${i}">${esc(e)}</button>`).join('')}</div>`;
  }
  const body = (o) => {
    if (q.os === 'shadow') return `<span class="sh">${esc(o)}</span>`;
    if (q.os === 'xf') return `<span class="xf" style="transform:${o === 'none' ? 'none' : esc(o)};font-weight:800">${esc(q.v.e)}</span>`;
    if (Array.isArray(o)) return `<span>${esc(o[0])}</span><small>${esc(o[1])}</small>`;
    return esc(o);
  };
  const isText = q.os === 'text' || q.t === 'clock';
  const cls = isText ? 'text' : q.os === 'eq' ? 'eq' : '';
  return `<div class="opts">${q.o.map((o,i) => `<button class="opt ${cls}" data-i="${i}" ${q.t==='clock'||q.t==='money'?'style="font-size:26px"':''}>${body(o)}</button>`).join('')}</div>`;
}
function clockSvg(h, m){
  const hA = ((h % 12) + m / 60) * 30, mA = m * 6;
  let nums = '';
  for (let n = 1; n <= 12; n++){ const a = n * 30 * Math.PI / 180; nums += `<text x="${100 + 70*Math.sin(a)}" y="${100 - 70*Math.cos(a) + 8}" text-anchor="middle" font-size="22" font-weight="800" fill="#2a2017">${n}</text>`; }
  let ticks = '';
  for (let k = 0; k < 60; k++){ const a = k * 6 * Math.PI / 180, r1 = k % 5 ? 86 : 82; ticks += `<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+90*Math.sin(a)}" y2="${100-90*Math.cos(a)}" stroke="#2a2017" stroke-width="${k%5?1.5:3}"/>`; }
  return `<svg viewBox="0 0 200 200" width="210" height="210" role="img" aria-label="clock">
    <circle cx="100" cy="100" r="95" fill="#fff" stroke="#1f8a5b" stroke-width="7"/>${ticks}${nums}
    <line x1="100" y1="100" x2="100" y2="52" stroke="#2a2017" stroke-width="8" stroke-linecap="round" transform="rotate(${hA} 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="26" stroke="#e2463a" stroke-width="5" stroke-linecap="round" transform="rotate(${mA} 100 100)"/>
    <circle cx="100" cy="100" r="7" fill="#2a2017"/></svg>`;
}
/* matchstick equation: each digit is a 7-segment figure made of sticks */
function matchSvg(eq){
  const SEGS = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg'};
  const P = {a:[12,8,48,8], b:[54,14,54,48], c:[54,58,54,92], d:[12,98,48,98], e:[6,58,6,92], f:[6,14,6,48], g:[12,53,48,53], h:[10,53,50,53], v:[30,33,30,73]};
  let x = 6, out = '';
  const stick = (s, ox) => { const [x1,y1,x2,y2] = P[s]; return `<line x1="${x1+ox}" y1="${y1}" x2="${x2+ox}" y2="${y2}" stroke="#e8b46a" stroke-width="7" stroke-linecap="round"/><circle cx="${x1+ox}" cy="${y1}" r="5" fill="#d8402f"/>`; };
  for (const ch of eq){
    if (SEGS[ch]) { for (const s of SEGS[ch]) out += stick(s, x); x += 72; }
    else if (ch === '+') { out += stick('h', x) + stick('v', x); x += 66; }
    else if (ch === '-') { out += stick('h', x); x += 66; }
    else if (ch === '=') { out += `<line x1="${x+10}" y1="42" x2="${x+50}" y2="42" stroke="#9aa" stroke-width="6" stroke-linecap="round"/><line x1="${x+10}" y1="64" x2="${x+50}" y2="64" stroke="#9aa" stroke-width="6" stroke-linecap="round"/>`; x += 66; }
  }
  return `<svg viewBox="0 0 ${x} 106" width="100%" style="max-width:${Math.min(460, x * 0.9)}px" role="img" aria-label="${esc(eq)}">${out}</svg>`;
}
/* gears: touching circles with teeth; green = the one that starts, 🎯 = the question */
function gearSvg(v){
  const r = v.r, xs = v.pts.map(p => p[0]), ys = v.pts.map(p => p[1]);
  const pad = r + 10, minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad, W = Math.max(...xs) + pad - minX, H = Math.max(...ys) + pad - minY;
  const teeth = 2 * Math.PI * (r + 3) / 14;
  const g = v.pts.map(([x, y], i) => {
    const fill = i === v.start ? '#3fb37f' : i === v.target ? '#ffd54a' : '#c9b79c';
    return `<circle cx="${x}" cy="${y}" r="${r + 3}" fill="none" stroke="#6b5a45" stroke-width="7" stroke-dasharray="${(teeth/2).toFixed(2)} ${(teeth/2).toFixed(2)}"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#6b5a45" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="5" fill="#6b5a45"/>
      ${i === v.start ? `<text x="${x}" y="${y + 9}" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">↻</text>` : ''}
      ${i === v.target ? `<text x="${x}" y="${y + 9}" text-anchor="middle" font-size="24">🎯</text>` : ''}`;
  }).join('');
  return `<svg viewBox="${minX} ${minY} ${W} ${H}" width="100%" style="max-width:340px;max-height:300px" role="img" aria-label="gears">${g}</svg>`;
}
/* unfolded box: squares with pictures */
function netSvg(v){
  const S = 62, rows = Math.max(...v.cells.map(c => c[0])) + 1, cols = Math.max(...v.cells.map(c => c[1])) + 1;
  const sq = v.cells.map(([r, c, e]) => `<rect x="${c*S+3}" y="${r*S+3}" width="${S}" height="${S}" fill="${e === v.ask ? '#fff3cf' : '#fff'}" stroke="#6b5a45" stroke-width="3" stroke-dasharray="${e === v.ask ? '0' : '0'}"/>
    <text x="${c*S+3+S/2}" y="${r*S+3+S/2+12}" text-anchor="middle" font-size="34">${e}</text>`).join('');
  return `<svg viewBox="0 0 ${cols*S+6} ${rows*S+6}" width="100%" style="max-width:${Math.min(340, cols*S*1.1)}px" role="img" aria-label="box net">${sq}</svg>`;
}
function mazeSvg(v){
  const n = v.starts.length, W = 320, H = 340, top = 52, bot = H - 52;
  const X = c => 34 + c * (W - 68) / (n - 1);
  const colors = ['#e2463a','#2f6fd6','#1f8a5b','#c27c0e'];
  const paths = v.paths.map((pts, s) => {
    const P = pts.map((c, k) => [X(c), top + k * (bot - top) / (pts.length - 1)]);
    let d = `M${P[0][0]} ${P[0][1]}`;
    for (let k = 0; k < P.length - 1; k++){
      const p1 = P[k], p2 = P[k+1], dy = (p2[1] - p1[1]) / 2;
      d += ` C${p1[0].toFixed(1)} ${(p1[1]+dy).toFixed(1)} ${p2[0].toFixed(1)} ${(p2[1]-dy).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return `<path d="${d}" fill="none" stroke="${v.color ? colors[s] : '#5a4a3a'}" stroke-width="5" stroke-linecap="round"/>`;
  }).join('');
  const icons = v.starts.map((e, s) => `<text x="${X(s)}" y="36" text-anchor="middle" font-size="30">${e}</text>`).join('')
              + v.ends.map((e, s) => `<text x="${X(s)}" y="${H - 14}" text-anchor="middle" font-size="30">${e}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:340px" role="img" aria-label="lines">${paths}${icons}</svg>`;
}

/* ---------- level finished ---------- */
async function finishLevel(){
  if (G.saving) return; G.saving = true;
  loading(L('Saving your score…','আপনার স্কোর সংরক্ষণ হচ্ছে…'));

  if (practice){
    const r = await api('practice', authed({level:G.lv, score:G.score, gid:G.gid, time:Math.round(G.time)}));
    if (!r.ok){
      if (r.error === 'network'){ G.saving = false; return netError(finishLevel); }
      if (r.error === 'auth') return logout();
      toast(L('Could not save coins','কয়েন সংরক্ষণ হয়নি'));
    } else S.player = r.player;
  } else {
    if (await flush() === false){ G.saving = false; return netError(finishLevel); }

  }
  const st = starsFor(G.mistakes);
  const newBadges = earned(S.player).filter(id => !G.before.includes(id)).map(id => BADGES.find(b => b.id === id));
  const joke = st === 3 ? pick(JOKES.pass) : st === 2 ? pick(JOKES.right) : pick(JOKES.fail);

  render(`
    <div class="card center pop">
      ${mascot(st >= 2 ? 'party' : 'laugh')}
      <h2>${practice ? L('Practice done! 🔁','অনুশীলন শেষ! 🔁') : L(`Level ${G.lv} complete! 🎉`,`লেভেল ${G.lv} শেষ! 🎉`)}</h2>
      <div class="stars">${starStr(st)}</div>
      <div class="bubble" style="margin-top:8px">${L(esc(joke[0]), esc(joke[1]))}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="big-num">${G.score}</div><small>${L('Points','পয়েন্ট')}</small></div>
      <div class="stat"><div class="big-num">${G.mistakes}</div><small>${L('Mistakes','ভুল')}</small></div>
      <div class="stat"><div class="big-num">${fmtTime(G.time)}</div><small>${L('Time taken','সময় লেগেছে')}</small></div>
      <div class="stat"><div class="big-num">+${Math.floor(G.score/10)}</div><small>💰 ${L('Coins','কয়েন')}</small></div>
    </div>
    ${practice ? `<p class="center" style="font-size:15px;color:var(--muted)">${L('Practice earns coins only. Your leaderboard score stays from your first play.','অনুশীলনে শুধু কয়েন। লিডারবোর্ডে প্রথমবারের স্কোরই থাকবে।')}</p>` : ''}
    ${newBadges.length ? `<div class="card center"><h3>${L('New prize unlocked!','নতুন পুরস্কার!')}</h3>${newBadges.map(b => `<div style="font-size:46px">${b.e}</div><b>${esc(b.n[0])} · ${esc(b.n[1])}</b>`).join('<br>')}</div>` : ''}
    ${S.player.rank ? `<p class="center">${L(`You are #${S.player.rank} on the leaderboard`,`লিডারবোর্ডে আপনি #${S.player.rank}`)}</p>` : ''}
    ${hasNext ? `<button class="btn" id="nx">${L('Next level ▶','পরের লেভেল ▶')}</button>` : ''}
    <button class="btn ${hasNext ? 'alt' : ''}" id="again">🔁 ${L('Practice this level','এই লেভেল অনুশীলন')}</button>

  const resBtns = $app.querySelectorAll('.btn'); resBtns.forEach(b => b.disabled = true);
  setTimeout(() => resBtns.forEach(b => b.disabled = false), 700);

    ${r.me && r.me.rank > 30 ? `<p class="center">${L(`Your rank: #${r.me.rank} of ${r.total}`,`আপনার অবস্থান: #${r.me.rank}`)}</p>` : ''}
    <button class="btn alt" id="back2">🏠 ${L('Home','হোম')}</button>`);
  document.getElementById('back').onclick = showHome;
  document.getElementById('back2').onclick = showHome;
}

/* ---------- Season 1 Hall of Fame ---------- */
async function showHof(){
  loading();
  const r = await api('hof', {phone:S.phone});
  if (!r.ok) return r.error === 'network' ? netError(showHof) : (toast('Error'), showHome());
  const medal = n => ['','🥇','🥈','🥉'][n] || n;
  const rows = r.rows.map(x => `
    <tr class="${x.you?'you':''}"><td class="rk">${medal(x.rank)}</td>
      <td class="nm"><b>${esc(x.name)}${x.you ? ' (you · আপনি)' : ''}</b><small>⭐ ${x.stars} · ${x.passed} ${L('levels passed','লেভেল পাস')}</small></td>
      <td class="sc">${x.score}<small>⏱ ${fmtTime(x.time)}</small></td></tr>`).join('');
  const top = r.rows.slice(0, 3);
  render(`
    <div class="topbar"><button class="linkbtn" id="back">◀ ${L('Back','পেছনে')}</button><span></span></div>
    <div class="card center hofcard">
      <div style="font-size:46px">🏛️</div>
      <h2>${L('Season 1 Hall of Fame','সিজন ১ হল অফ ফেম')}</h2>
      <p style="margin:0;font-size:15px">${L('Final results. Congratulations, champions!','চূড়ান্ত ফলাফল। চ্যাম্পিয়নদের অভিনন্দন!')}</p>
      ${top.length ? `<div class="podium">${[1, 0, 2].filter(i => top[i]).map(i => `<div class="pod p${i+1}"><div style="font-size:34px">${medal(i+1)}</div><b>${esc(top[i].name)}</b><small>${top[i].score}</small></div>`).join('')}</div>` : ''}
    </div>
    <div class="card" style="padding:6px 10px">
      ${rows ? `<table class="lb">${rows}</table>` : `<p class="center">${L('No Season 1 results yet.','সিজন ১ এর ফলাফল নেই।')}</p>`}
    </div>
    <button class="btn alt" id="back2">🏠 ${L('Home','হোম')}</button>`);
  document.getElementById('back').onclick = showHome;
  document.getElementById('back2').onclick = showHome;
}

/* ---------- Mama's rules (Bangla) — every player must agree before playing ---------- */
const rulesKey = () => 'bt_rules_' + S.phone;
const agreed = () => store.get(rulesKey()) === RULES_VER;
function showRules(back){
  const ok = agreed();

    <div class="topbar"><button class="linkbtn" id="back">◀ ${L('Back','পেছনে')}</button><span></span></div>

    ${sec('👆 উত্তর দেওয়ার নিয়ম', `<p>ভুল হলে মামা হাসবে, কিন্তু খেলা থামবে না। সঠিক না হওয়া পর্যন্ত চাপতে থাকেন!</p>
      <ul><li>✅ <b>প্রথম চাপেই সঠিক</b> → ১০০ পয়েন্ট + দ্রুততার বোনাস (৫০ পর্যন্ত) 🚀</li>
      <li>✌️ <b>দ্বিতীয় চাপে</b> → ৪০ পয়েন্ট (চলে আর কি)</li>
      <li>🤏 <b>তৃতীয় চাপে</b> → ১০ পয়েন্ট (সান্ত্বনা পুরস্কার)</li>

      <p>সাবধান! <b>বিরতি দিলেও ঘড়ি চলে।</b> প্রশ্ন দেখে বিরতি নিয়ে গুগলে খুঁজবেন? মামা সব দেখে! 👀 তাই আগে প্রশ্নটা শেষ করেন, তারপর চা খেতে যান।</p>`)}
    ${sec('💾 সেভের নিয়ম', `<p>প্রতিটা উত্তরের পরই সেভ হয়ে যায়। কারেন্ট গেল, ফোন এলো, আম্মু ডাকলো, নেট চলে গেল? কোনো চিন্তা নাই! পরে এসে যেখানে থেমেছিলেন সেখান থেকেই শুরু। 😌</p>`)}
    ${sec('🏆 লিডারবোর্ডের নিয়ম', `<ul><li>প্রতিটা লেভেলের <b>প্রথমবারের খেলাই</b> গণনা হয়। একবারে ভালো খেলেন, এটাই আসল পরীক্ষা! 📝</li>
      <li>স্কোর সমান হলে যে দ্রুত শেষ করেছে, সে এগিয়ে। ধীরে চলো নীতি এখানে চলে না! 🐢❌</li></ul>`)}
    ${sec('🔁 অনুশীলন', `<p>লেভেল শেষ? আবার খেলতে পারবেন, কিন্তু সেটা শুধু <b>অনুশীলন</b>: কয়েন পাবেন, লিডারবোর্ডে কোনো প্রভাব নাই। মানে বারবার খেলে এক নম্বর হওয়ার দিন শেষ! 😎</p>`)}

    ${sec('💰 কয়েন আর মামার হিন্ট', `<p>প্রতিটা খেলায় পয়েন্টের দশ ভাগের এক ভাগ কয়েন পাবেন।</p>
      <p>আটকে গেলে <b>💡 মামার হিন্ট</b> নেন: ১০০ কয়েন দিলে মামা ২টা ভুল উত্তর সরিয়ে দেবে। তবে প্রথম ভুল চাপের আগেই নিতে হবে। মামা ফ্রিতে কিছু দেয় না, ব্যবসা বলে কথা! 😜</p>`)}
    ${sec('🎁 পুরস্কার ও উপাধি', `<p>লেভেল শেষ করতে থাকেন, উপাধি বাড়তে থাকবে: চায়ের দোকানের চিন্তাবিদ থেকে একদম <b>জাতীয় সম্পদ 🏆</b>!</p>
      <p>১০টা লেভেলেই ৩ তারা পেলে মামা সোনার টুপি আর কালো চশমা পরে আপনাকে সালাম দেবে। 😎👑</p>`)}
    ${sec('🏛️ সিজন ১', `<p>সিজন ১-এর চ্যাম্পিয়নরা হল অফ ফেমে অমর হয়ে আছেন। এবার আপনার পালা!</p>`)}

    ${ok ? `<div class="agreebox done">✅ আপনি মামার নিয়মকানুনে রাজি হয়েছেন। শুভকামনা! 🍀</div>
      <button class="btn" id="back2">${back ? 'বুঝেছি, খেলা চালু করি! ▶' : '🏠 হোম'}</button>` :
    `<div class="agreebox">
      <label><input type="checkbox" id="agree"> <span>আমি মামার সব নিয়মকানুন পড়েছি, বুঝেছি এবং সৎভাবে খেলবো। কোনো চালাকি করবো না! 🤝</span></label>
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="back2" disabled>রাজি আছি! খেলা শুরু করি ▶</button>
    <button class="btn alt" id="later">এখন না, পরে পড়বো</button>`}`);
  const go = back || showHome;
  document.getElementById('back').onclick = ok ? go : showHome;
  if (ok){ document.getElementById('back2').onclick = go; return; }
  const box = document.getElementById('agree'), btn = document.getElementById('back2');
  box.onchange = () => { btn.disabled = !box.checked; };
  btn.onclick = () => {
    if (!box.checked){ document.getElementById('err').textContent = 'আগে টিক চিহ্ন দিন, তারপর রাজি হন!'; return; }

    toast('ধন্যবাদ! মামা খুশি হয়েছে ☕😄');
    go();
  };
  document.getElementById('later').onclick = showHome;
}

/* ---------- prizes ---------- */
function showPrizes(){
  const have = earned(S.player), list = BADGES.filter(b => !b.hidden || have.includes(b.id));
  render(`
    <div class="topbar"><button class="linkbtn" id="back">◀ ${L('Back','পেছনে')}</button><span></span></div>
    <div class="card center">${mascot('party','sm')}<h2>${L('My Prizes 🎁','আমার পুরস্কার 🎁')}</h2>
      <p style="margin:0">${L(`${have.length} of ${list.length} collected`,`${list.length}টার মধ্যে ${have.length}টা পেয়েছেন`)}</p></div>
    <div class="badges">${list.map(b => `<div class="badge ${have.includes(b.id)?'':'off'}"><div class="e">${b.e}</div><b>${esc(b.n[0])}</b><small>${esc(b.n[1])}</small><small style="margin-top:4px">${have.includes(b.id) ? '✅' : '🔒'} ${esc(b.d[0])}<br>${esc(b.d[1])}</small></div>`).join('')}</div>
    <h3 style="margin-top:16px">${L('Level trophies','লেভেল ট্রফি')}</h3>
    <div class="card">${window.LEVELS.map(l => { const pr = progOf(l.n); return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${l.icon} ${esc(l.name[0])}</span><span>${pr && pr.done ? starStr(starsFor(pr.m)) : pr && pr.i ? `⏳ ${pr.i}/${pr.ids.length}` : '—'}</span></div>`; }).join('')}</div>
    <button class="btn alt" id="back2">🏠 ${L('Home','হোম')}</button>`);
  document.getElementById('back').onclick = showHome;
  document.getElementById('back2').onclick = showHome;
}

/* ---------- start ---------- */
(async function boot(){
  if (!window.PUZZLES || !window.LEVELS){ render(`<div class="card center">questions.js is missing.</div>`); return; }
  if (!S.phone || !S.token) return showLogin();
  loading();
  const r = await api('me', authed());
  if (r.ok){ S.player = r.player; showHome(); flush().then(ok => { if (ok && qLoad().length === 0) api('me', authed()).then(x => { if (x.ok) S.player = x.player; }); }); return; }
  if (r.error === 'network') return netError(boot);
  logout();
})();
</script>
